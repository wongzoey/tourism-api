scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")
scalar Date @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Date")

"A day-by-day breakdown of activities in a tour."
type ItineraryDay {
    day: Int!
    title: String!
    description: String
    meals: [String!]
}

"The primary Tour entity."
type Tour {
    id: ID!
    title: String!
    slug: String!
    summary: String
    description: String
    destination: String!
    region: String
    duration_days: Int!
    duration_nights: Int!
    formatted_duration: String
    max_group_size: Int
    price: Float!
    formatted_price: String
    currency: String!
    itinerary: [ItineraryDay!]
    inclusions: [String!]
    exclusions: [String!]
    featured_image: String
    gallery: [String!]
    is_featured: Boolean!
    is_active: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
}

"Input filters for searching and refining tours."
input TourFilterInput {
    destination: String
    min_price: Float
    max_price: Float
    is_featured: Boolean
    duration_days: Int
    sort_by_price: SortOrder
}

enum SortOrder {
    ASC
    DESC
}

type Query {
    "Fetch a paginated list of active tours with custom filters."
    tours(
        filter: TourFilterInput
    ): [Tour!]! 
        @paginate(builder: "App\\GraphQL\\Queries\\TourResolver@tours")

    "Fetch a single tour by either its unique ID or URL slug."
    tour(
        id: ID
        slug: String
    ): Tour 
        @field(resolver: "App\\GraphQL\\Queries\\TourResolver@find")
}

"Represents an aggregated destination showcase on the homepage."
type PopularDestination {
    name: String!
    region: String
    image: String
    total_tours: Int!
    starting_price: Float!
    currency: String!
}

extend type Query {
    "Fetches top Malaysian destinations, cached in Redis."
    popularDestinations(limit: Int = 6): [PopularDestination!]!
        @field(resolver: "App\\GraphQL\\Queries\\PopularDestinationsResolver")
}

type Mutation {
    createBooking(
        tour_id: ID!
        customer_name: String!
        customer_email: String!
        start_date: Date!
        total_price: Float!
        status: String!
    ): Booking @create
}

type Booking {
    id: ID!
    tour_id: ID!
    customer_name: String!
    customer_email: String!
    start_date: Date!
    total_price: Float!
    status: String!
    created_at: DateTime!
    updated_at: DateTime!
}

extend type Query {
    askChatbot(message: String!): String!
}